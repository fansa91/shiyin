name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: tar -czf shiyin-web-dist.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/shiyin-web-dist.tar.gz

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: tar -czf shiyin-api-dist.tar.gz dist package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api/shiyin-api-dist.tar.gz

  release:
    needs: [web, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: |
          cp deploy/deploy.sh deploy/shiyin-api.service deploy/Caddyfile README.md assets/
          ls -la assets/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          make_latest: true
          files: assets/*
